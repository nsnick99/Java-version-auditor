name: Temporary auditor validation
on:
  push:
    branches: [main]
    paths:
      - auditor.py
      - main.py
      - README.md
      - .github/workflows/temporary-validation.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m py_compile auditor.py main.py
      - name: Verify build-tool offline flags are independent of API offline mode
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from types import SimpleNamespace
          from unittest.mock import patch
          import auditor

          with tempfile.TemporaryDirectory() as folder:
              root = Path(folder)
              (root / "pom.xml").write_text("<project/>", encoding="utf-8")

              for offline in (False, True):
                  with patch("auditor.subprocess.run", return_value=SimpleNamespace(returncode=1, stderr="synthetic", stdout="")) as run:
                      auditor.resolve_maven_tree(root, offline=offline)
                      command = run.call_args.args[0]
                      assert ("-o" in command) is offline, command

                  with patch("auditor.subprocess.run", return_value=SimpleNamespace(returncode=1, stderr="synthetic", stdout="")) as run:
                      auditor.resolve_maven_effective_pom(root, offline=offline)
                      command = run.call_args.args[0]
                      assert ("-o" in command) is offline, command

              for offline in (False, True):
                  with patch("auditor.subprocess.run", return_value=SimpleNamespace(returncode=1, stderr="synthetic", stdout="")) as run:
                      auditor.resolve_gradle_tree(root, offline=offline)
                      commands = [call.args[0] for call in run.call_args_list]
                      assert commands, "Gradle was not invoked"
                      assert all(("--offline" in command) is offline for command in commands), commands

          print("Build-tool offline flag tests passed")
          PY
      - name: Smoke-test compact offline report and Maven inherited-version labels
        run: |
          set -euo pipefail
          project="$(mktemp -d)"
          mkdir -p "$project/SmallestSpringApp"
          cat > "$project/SmallestSpringApp/pom.xml" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>example</groupId>
            <artifactId>smallest-spring-sample</artifactId>
            <version>1.0.0</version>
            <parent>
              <groupId>org.springframework.boot</groupId>
              <artifactId>spring-boot-starter-parent</artifactId>
              <version>1.2.0.RELEASE</version>
            </parent>
            <build>
              <plugins>
                <plugin>
                  <groupId>org.springframework.boot</groupId>
                  <artifactId>spring-boot-maven-plugin</artifactId>
                </plugin>
              </plugins>
            </build>
            <dependencies>
              <dependency>
                <groupId>org.springframework.boot</groupId>
                <artifactId>spring-boot-starter-web</artifactId>
              </dependency>
            </dependencies>
          </project>
          POM
          python main.py "$project" --offline --output "$project/output.json"
          python - "$project/output.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as file:
              report = json.load(file)

          assert report["summary"]["components_scanned"] == 4, report["summary"]
          assert report["summary"]["components_needing_review"] == 3, report["summary"]
          assert report["summary"]["components_ok"] == 0, report["summary"]
          assert report["summary"]["status"] == "CHECK_INCOMPLETE", report["summary"]
          assert report["checks"] == {
              "latest_versions": "SKIPPED",
              "vulnerabilities": "SKIPPED",
              "lifecycle": "SKIPPED",
          }, report["checks"]

          expected = {
              ("Java", "technology"),
              ("org.springframework.boot:spring-boot-starter-web", "dependency"),
              ("org.springframework.boot:spring-boot-maven-plugin", "build_plugin"),
          }
          found = {(item["component"], item["category"]) for item in report["review_items"]}
          assert expected <= found, (expected, found)
          for coordinate in (
              "org.springframework.boot:spring-boot-starter-web",
              "org.springframework.boot:spring-boot-maven-plugin",
          ):
              item = next(entry for entry in report["review_items"] if entry["component"] == coordinate)
              assert any(issue["type"] == "VERSION_INHERITED_UNRESOLVED" for issue in item["issues"]), item

          print("Offline report smoke test passed")
          PY
