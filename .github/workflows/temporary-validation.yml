name: Temporary auditor validation
on:
  push:
    paths:
      - 'auditor.py'
      - 'main.py'
      - '.github/workflows/temporary-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile application
        run: python -m py_compile auditor.py main.py
      - name: Verify offline internal Maven lookup
        run: |
          python - <<'PY'
          import json
          import tempfile
          import threading
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          from auditor import audit

          metadata = b"""<?xml version="1.0" encoding="UTF-8"?>
          <metadata><versioning><release>2.0.0</release><versions><version>1.0.0</version><version>2.0.0</version></versions></versioning></metadata>"""

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "application/xml")
                  self.send_header("Content-Length", str(len(metadata)))
                  self.end_headers()
                  self.wfile.write(metadata)
              def log_message(self, *args):
                  pass

          server = ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          try:
              with tempfile.TemporaryDirectory() as tmp:
                  project = Path(tmp) / "sample"
                  project.mkdir()
                  pom = project / "pom.xml"
                  pom.write_text(f'''<project>
                    <modelVersion>4.0.0</modelVersion>
                    <groupId>example</groupId><artifactId>sample</artifactId><version>1.0.0</version>
                    <repositories><repository><id>internal-test</id><url>http://127.0.0.1:{server.server_port}/repository</url></repository></repositories>
                    <properties><java.version>17</java.version><spring-boot.version>1.0.0</spring-boot.version></properties>
                    <dependencies><dependency><groupId>org.example</groupId><artifactId>demo</artifactId><version>1.0.0</version></dependency></dependencies>
                  </project>''', encoding="utf-8")
                  report = audit(project, online=False, resolve=False)
                  assert report["scan"]["mode"] == "OFFLINE", report["scan"]
                  assert report["scan"]["version_lookup_source"] == "CONFIGURED_MAVEN_REPOSITORIES", report["scan"]
                  assert report["checks"]["latest_versions"] != "SKIPPED", report["checks"]
                  assert report["checks"]["vulnerabilities"] == "SKIPPED", report["checks"]
                  assert report["checks"]["lifecycle"] == "SKIPPED", report["checks"]
                  assert report["summary"]["updates_available"] >= 1, report["summary"]
                  assert "127.0.0.1" not in json.dumps(report), "Internal repository URL leaked into report"
                  print("PASS", report["checks"], report["summary"]["updates_available"])
          finally:
              server.shutdown()
              server.server_close()
          PY