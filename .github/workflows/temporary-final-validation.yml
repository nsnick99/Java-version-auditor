name: Temporary final internal-mode validation
on:
  push:
    paths:
      - 'auditor.py'
      - 'main.py'
      - '.github/workflows/temporary-final-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile auditor.py main.py
      - name: Test internal-only and zero-network
        run: |
          python - <<'PY'
          import json, threading, tempfile
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          import auditor

          seen = []
          metadata = b'<metadata><versioning><release>2.0.0</release><versions><version>1.0.0</version><version>2.0.0</version></versions></versioning></metadata>'
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  seen.append(self.path)
                  self.send_response(200)
                  self.send_header("Content-Length", str(len(metadata)))
                  self.end_headers()
                  self.wfile.write(metadata)
              def log_message(self, *args): pass

          server = ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          try:
              with tempfile.TemporaryDirectory() as tmp:
                  project = Path(tmp) / "sample"
                  project.mkdir()
                  (project / "pom.xml").write_text(f'''<project>
                    <modelVersion>4.0.0</modelVersion>
                    <groupId>example</groupId><artifactId>sample</artifactId><version>1.0.0</version>
                    <name>Sample</name>
                    <parent><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-parent</artifactId><version>1.0.0</version></parent>
                    <properties><java.version>17</java.version></properties>
                    <repositories><repository><id>internal-maven</id><url>http://127.0.0.1:{server.server_port}/repo</url></repository></repositories>
                    <dependencies><dependency><groupId>org.example</groupId><artifactId>demo</artifactId><version>1.0.0</version></dependency></dependencies>
                  </project>''', encoding="utf-8")
                  auditor.http_json = lambda *a, **k: (_ for _ in ()).throw(AssertionError("Public lifecycle request"))
                  parsed = auditor.parse_pom(project / "pom.xml", project)
                  assert parsed["dependencies"][0]["group_id"] == "org.example"
                  assert parsed["dependencies"][0]["artifact_id"] == "demo"
                  report = auditor.audit(project, internal_only=True)
                  assert report["checks"]["mode"] == "INTERNAL_ONLY"
                  assert report["checks"]["latest_versions_checked"] == 2, report["checks"]
                  assert report["checks"]["lifecycle"] == "SKIPPED"
                  assert report["summary"]["outdated_components"] >= 1
                  assert seen and all(path.startswith("/repo/") for path in seen), seen
                  assert "repo.maven.apache.org" not in json.dumps(report)
                  before = len(seen)
                  offline = auditor.audit(project, offline=True)
                  assert len(seen) == before and offline["checks"]["mode"] == "OFFLINE"
                  print("PASS")
          finally:
              server.shutdown()
              server.server_close()
          PY