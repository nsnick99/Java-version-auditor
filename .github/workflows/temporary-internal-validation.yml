name: Temporary internal-only validation
on:
  push:
    paths:
      - 'auditor.py'
      - 'main.py'
      - '.github/workflows/temporary-internal-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile files
        run: python -m py_compile auditor.py main.py
      - name: Verify internal-only and zero-network modes
        run: |
          python - <<'PY'
          import json
          import threading
          import tempfile
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          import auditor

          requests = []
          metadata = b"""<?xml version="1.0" encoding="UTF-8"?>
          <metadata><groupId>org.example</groupId><artifactId>demo</artifactId>
          <versioning><release>2.0.0</release><latest>2.0.0</latest>
          <versions><version>1.0.0</version><version>2.0.0</version></versions>
          </versioning></metadata>"""

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  requests.append(self.path)
                  self.send_response(200)
                  self.send_header("Content-Type", "application/xml")
                  self.send_header("Content-Length", str(len(metadata)))
                  self.end_headers()
                  self.wfile.write(metadata)
              def log_message(self, *args):
                  pass

          server = ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          try:
              with tempfile.TemporaryDirectory() as tmp:
                  project = Path(tmp) / "sample"
                  project.mkdir()
                  pom = project / "pom.xml"
                  pom.write_text(f'''<project>
                    <modelVersion>4.0.0</modelVersion>
                    <groupId>example.project</groupId><artifactId>sample</artifactId><version>1.0.0</version>
                    <name>Sample Project</name>
                    <parent><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-parent</artifactId><version>1.0.0</version></parent>
                    <properties><java.version>17</java.version></properties>
                    <repositories><repository><id>internal-maven</id><url>http://127.0.0.1:{server.server_port}/repository</url></repository></repositories>
                    <dependencies><dependency><groupId>org.example</groupId><artifactId>demo</artifactId><version>1.0.0</version></dependency></dependencies>
                  </project>''', encoding="utf-8")

                  parsed = auditor.parse_pom(pom, project)
                  assert parsed["dependencies"][0]["group_id"] == "org.example", parsed
                  assert parsed["dependencies"][0]["artifact_id"] == "demo", parsed
                  assert parsed["dependencies"][0]["version"] == "1.0.0", parsed

                  def forbidden_external(*args, **kwargs):
                      raise AssertionError("Public lifecycle/API call attempted in internal-only mode")
                  auditor.http_json = forbidden_external

                  report = auditor.audit(project, internal_only=True)
                  assert report["checks"]["mode"] == "INTERNAL_ONLY", report["checks"]
                  assert report["checks"]["latest_versions_checked"] == 2, report["checks"]
                  assert report["checks"]["lifecycle"] == "SKIPPED", report["checks"]
                  assert report["summary"]["outdated_components"] >= 1, report["summary"]
                  assert requests and all(path.startswith("/repository/") for path in requests), requests
                  assert "repo.maven.apache.org" not in json.dumps(report), "Public Central leaked into result"
                  assert "endoflife.date" not in json.dumps(report), "Public lifecycle URL leaked into result"

                  before = len(requests)
                  offline = auditor.audit(project, offline=True)
                  assert len(requests) == before, "Offline mode issued an HTTP request"
                  assert offline["checks"]["mode"] == "OFFLINE", offline["checks"]
                  print("PASS: correct POM parsing, internal metadata only, no lifecycle requests, no-network offline mode.")
          finally:
              server.shutdown()
              server.server_close()
          PY